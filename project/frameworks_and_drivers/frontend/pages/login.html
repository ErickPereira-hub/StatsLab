<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatsLabe - Login</title>
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>
    <main class="page">
        <section class="card">
            <div class="header">
                <div class="logo"></div>
                <h1>Welcome back</h1>
                <p>
                    Enter in your account to continue
                </p>
            </div>
            <form class="form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="ilemail"
                        name="email"
                        placeholder="your@email.com"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="ilpw"
                        name="password"
                        placeholder="Type your password"
                        required
                    >
                </div>
                <div class="form-options">
                    <a href="#" style = "color: black;">Did you forget your password?</a>
                </div>
                <p id = "ierr"></p>
                <button type="submit">
                    Enter
                </button>
            </form>
            <p class="text">
                Don't have an account yet?
                <a href="register.html">Create account</a>
            </p>
        </section>
    </main>
    <script src = "../interaction/login/request_login.js" type = "module"></script>
    <script src = "../interaction/login/login_event.js" type = "module"></script>
</body>
</html>
