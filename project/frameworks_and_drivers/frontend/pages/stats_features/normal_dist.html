<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>StatsLab - Normal Distribution</title>
        <link rel="stylesheet" href="../../style/inner_style.css">
        <link rel="stylesheet" href="../../style/style.css">
        <link rel="stylesheet" href="../../style/stats_features/normal_dist.css">
        <link rel = "stylesheet" href="../../style/charts.css">
    </head>
    <body>
    <header class="site-header">
        <div class="header-content">
            <a href="/" class="project-name">
                StatsLab
            </a>
            <button class="logout-button" type="button" onclick = "logoutUser('../login.html')">
                Logout
            </button>
        </div>
        <nav class="navbar">
            <div class="nav-content">
                <div class="menu-button" type="button" onclick = "togleBurguer()">
                </div>
                <div class="nav-links" id = "imenu">
                    <div><a href="../home.html">Home</a></div>
                    <div><a href="../simulation.html">Simulations</a></div>
                    <div><a href="../contact.html">Contact</a></div>
                </div>
            </div>
        </nav>
    </header>
    <main class="normal-main">
        <section class="normal-header">
            <h1>Normal Distribution</h1>
            <p>
                Calculate the probability of a measurement falling within a
                specified interval using the normal probability distribution.
            </p>
        </section>
        <section class="normal-card">
            <form class="normal-form">
                <div class="normal-input-row">
                    <div class="form-group">
                        <label for="mean">Mean</label>
                        <input
                            type="number"
                            id="mean"
                            name="mean"
                            step="any"
                            placeholder="Enter the mean"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="standard-deviation">
                            Standard Deviation
                        </label>
                        <input
                            type="number"
                            id="standard-deviation"
                            name="standard-deviation"
                            step="any"
                            placeholder="Enter the standard deviation"
                            min="0"
                            required
                        >
                    </div>
                </div>
                <div class="normal-input-row">
                    <div class="form-group">
                        <label for="start">Start Value</label>
                        <input
                            type="number"
                            id="start"
                            name="start"
                            step="any"
                            placeholder="Enter the start value"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="end">End Value</label>
                        <input
                            type="number"
                            id="end"
                            name="end"
                            step="any"
                            placeholder="Enter the final value"
                            required
                        >
                    </div>
                </div>
                <button type="submit" id = "send-data">
                    Calculate Probability
                </button>
            </form>
        </section>
        <section class="probability-result" id="iprob-show" style="display:none;">
            <p class="result-label">
                Probability
            </p>
            <h2 id = "prob-result"></h2>
            <p id = "imsg">
            </p>
            <div class="gaussian-chart">
                <canvas id="normalDistributionChart"></canvas>
            </div>
        </section>
    </main>
    <script src = "../../interaction/logout/request_logout.js"></script>
    <script src = "../../interaction/burguer_menu/burguer_listener.js"></script>
    <script src = "../../interaction/stats_features/normal_dist/listenner.js" type = "module"></script>
    </body>
</html>
